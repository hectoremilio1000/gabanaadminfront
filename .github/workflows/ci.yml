name: CI — gabanaadminfront

on:
  push:
    branches: [main, "hector_dev/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx eslint . || true   # warn-only en S7; endurecer a Sprint 8.
      - run: npm run build
